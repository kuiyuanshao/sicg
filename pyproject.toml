[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sicg"
version = "0.1.0"
description = "SICG imputation for regression inference under two-phase sampling"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["sicg", "benchmarks", "benchmarks.gain", "benchmarks.tabcsdi"]
package-dir = {"sicg" = "src/sicg"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
